configuration:
  language:
    name: Language
    description: Speech language. The bundled German model supports "de" only.
  default_voice:
    name: Default voice
    description: Voice used when Home Assistant does not request a specific one (default juergen). All voices appear in the Assist voice picker.
  threads:
    name: CPU threads
    description: Total ONNX Runtime thread budget. With the FP32 main model 3 is the measured sweet spot (2 is enough for INT8). Nearly 0 % CPU when idle.
  main_model:
    name: Main model
    description: "fp32 (recommended) = much clearer speech: in tests INT8 slurred/dropped about 10 % of words, FP32 below 1 %; about 0.15 s later start and roughly 250 MB more RAM. int8 = faster but less clear. fp32 needs the model pack from 1.0.2, otherwise int8 is used automatically."
  streaming:
    name: Streaming
    description: Send audio while it is generated. Turn off to send each answer as one block after it is complete (slower start, no gaps).
  first_chunk:
    name: First chunk (frames)
    description: Frames (80 ms each) decoded for the first chunk. Lower is faster to start.
  max_chunk:
    name: Max chunk (frames)
    description: Maximum frames per later chunk. Must be at least the first chunk.
  prebuffer_ms:
    name: Audio prebuffer (ms)
    description: Audio collected before sending the first block. Prevents short gaps; about 150 ms is a good compromise.
  lead_in_ms:
    name: Lead-in silence (ms)
    description: Silence the engine prepends to the first chunk. The adapter trims leading silence anyway; keep 0.
  warmup:
    name: Warm-up on start
    description: Synthesize a short test phrase after start so the first real request is fast.
  preload_voices:
    name: Preload all voices
    description: Build the voice and KV caches of all voices at start (takes about one minute the first time only).
  normalize_text:
    name: German text normalization
    description: Convert numbers, times, units and abbreviations to words (PocketTTS pronounces raw digits badly).
  ort_spinning:
    name: CPU spin-wait
    description: Let ONNX Runtime worker threads busy-wait between operations. Off saves CPU for other Home Assistant services.
  temperature:
    name: Sampling temperature
    description: Randomness of the voice generation (0.7 = upstream default). Lower values are more stable and consistent, higher values more lively.
  volume_boost_db:
    name: Volume boost (dB)
    description: Output gain with a soft limiter against clipping. PocketTTS is quiet on its own (about -26 dBFS); 8 dB brings it to a typical -19 dBFS. 0 = off.
  treble_boost_db:
    name: Treble boost (dB)
    description: Boosts frequencies from about 2 kHz (fully from 4 kHz) so the voice sounds less muffled. 8 dB roughly matches the tone of the reference voices. 0 = off.
  log_level:
    name: Log level
    description: Log verbosity. Spoken texts are only logged at "debug".
  import_url:
    name: Model pack URL (one-time import)
    description: Optional http(s) URL of the model pack tar.gz in your own network. Only used while no models (or no FP32 main model yet) are installed. Restart the app after setting it.
  import_sha256:
    name: Model pack SHA-256
    description: Optional SHA-256 of the file behind the import URL (recommended).
network:
  10302/tcp: Wyoming protocol (text-to-speech)
