configuration:
  language:
    name: Sprache
    description: Sprache der Ausgabe. Das mitgelieferte deutsche Modell unterstützt nur "de".
  default_voice:
    name: Standardstimme
    description: Stimme, wenn Home Assistant keine bestimmte anfordert (Standard george, im Blindtest bevorzugt). Alle Stimmen erscheinen in der Stimmenauswahl von Assist.
  threads:
    name: CPU-Threads
    description: Gesamtbudget an ONNX-Runtime-Threads. Mit FP32-Hauptmodell sind 3 der gemessene beste Kompromiss (mit INT8 reichen 2). Im Leerlauf fast 0 % CPU.
  main_model:
    name: Hauptmodell
    description: "fp32 (empfohlen) = deutlich verständlicher: in Tests verschluckte INT8 etwa 10 % der Wörter, FP32 unter 1 %; etwa 0,15 s späterer Start und rund 250 MB mehr RAM. int8 = schneller, aber undeutlicher. fp32 braucht das Modellpaket ab 1.0.2, sonst wird automatisch int8 genutzt."
  streaming:
    name: Streaming
    description: Audio senden, während es erzeugt wird. Aus = jede Antwort erst komplett erzeugen und dann in einem Block senden (späterer Start, keine Lücken).
  first_chunk:
    name: Erster Chunk (Frames)
    description: Frames (je 80 ms) für den ersten Audio-Chunk. Kleiner = schnellerer Start.
  max_chunk:
    name: Maximaler Chunk (Frames)
    description: Maximale Frames je weiterem Chunk. Muss mindestens so groß wie der erste Chunk sein.
  prebuffer_ms:
    name: Audio-Vorpuffer (ms)
    description: Audio, das vor dem ersten Block gesammelt wird. Verhindert kurze Lücken; etwa 150 ms sind ein guter Kompromiss.
  lead_in_ms:
    name: Vorlauf-Stille (ms)
    description: Stille, die die Engine vor den ersten Chunk setzt. Der Adapter schneidet führende Stille ohnehin ab; auf 0 lassen.
  warmup:
    name: Warmup beim Start
    description: Nach dem Start einen kurzen Testsatz erzeugen, damit die erste echte Anfrage schnell ist.
  preload_voices:
    name: Alle Stimmen vorladen
    description: Stimm- und KV-Caches aller Stimmen beim Start anlegen (nur beim ersten Mal etwa eine Minute).
  normalize_text:
    name: Deutsche Textnormalisierung
    description: Zahlen, Uhrzeiten, Einheiten und Abkürzungen in Wörter umwandeln (PocketTTS spricht rohe Ziffern schlecht).
  ort_spinning:
    name: CPU-Spin-Wait
    description: ONNX-Runtime-Threads zwischen Operationen aktiv warten lassen. Aus spart CPU für andere Home-Assistant-Dienste.
  temperature:
    name: Sampling-Temperatur
    description: Zufälligkeit der Stimmerzeugung (0,7 = Upstream-Standard). Niedriger = stabiler und gleichmäßiger, höher = lebendiger.
  volume_boost_db:
    name: Lautstärke-Anhebung (dB)
    description: Verstärkung der Ausgabe mit weichem Begrenzer gegen Übersteuern. PocketTTS ist von sich aus leise (ca. -26 dBFS); 8 dB bringen es auf übliche ca. -19 dBFS. 0 = aus.
  sound_profile:
    name: Klangprofil
    description: "Korrigiert den dumpfen Klang von PocketTTS (zu viel Dröhnen unter 100 Hz, zu wenig Präsenz bei 1-3 kHz). klar = an klare Sprachausgaben angeglichen, oben etwas heller (im Hörtest bevorzugt). weich = gleiche Korrektur, Höhen etwas zurückhaltender. aus = keine Klangkorrektur."
  level_speech:
    name: Lautstärkeausgleich
    description: Gleicht die Lautstärke über die ganze Antwort an. PocketTTS erzeugt jeden Satz mit eigenem Pegel und wird in langen Sätzen oft leiser ("mal laut, mal leise"). Langsam geregelt, ohne Pumpen; Gesamtlautstärke unverändert.
  log_level:
    name: Log-Level
    description: Ausführlichkeit der Logs. Gesprochene Texte werden nur bei "debug" protokolliert.
  import_url:
    name: Modellpaket-URL (einmaliger Import)
    description: Optionaler http(s)-Link auf das Modellpaket (tar.gz) in deinem eigenen Netzwerk. Wird nur genutzt, solange keine Modelle (oder noch kein FP32-Hauptmodell) installiert sind. Nach dem Eintragen die App neu starten.
  import_sha256:
    name: Modellpaket SHA-256
    description: Optionaler SHA-256 der Datei hinter der Import-URL (empfohlen).
network:
  10302/tcp: Wyoming-Protokoll (Text-to-Speech)
